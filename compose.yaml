services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: workout
    volumes:
      - workout-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  workout-data:
