name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: workout
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U workout"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure disposable push credentials
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import webpush from 'web-push';
          const keys = webpush.generateVAPIDKeys();
          appendFileSync(process.env.GITHUB_ENV, [
            `VAPID_PUBLIC_KEY=${keys.publicKey}`,
            `VAPID_PRIVATE_KEY=${keys.privateKey}`,
            'VAPID_SUBJECT=mailto:ci@example.invalid',
            '',
          ].join('\n'));
          NODE
      - run: npm run setup:local
      - run: npm run db:migrate
      - run: npm run api:generate && git diff --exit-code -- public/openapi.json contracts/api.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          RUN_DATABASE_TESTS: "1"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/tracker-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
